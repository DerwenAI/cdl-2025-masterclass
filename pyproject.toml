[project]
name = "cdl-2025-masterclass"
version = "1.0.0"
description = "Connected Data London 2025 Masterclass: Combining Data from Structured and Unstructured Sources to create High-Quality Knowledge Graphs"

readme = "README.md"
license = { file = "LICENSE" }

authors = [
    { name = "Paco Nathan", email = "paco@derwen.ai" },
    { name = "Prashanth Rao", email = "prashanth@lancedb.com" },
]

requires-python = ">=3.13"
dependencies = [
    # graph technologies
    "ryugraph>=25.9.0",
    "networkx>=3.4.2",
    "sz-semantics>=1.3.1",

    # Python "nuts and bolts"
    "numpy>=2.3.2",
    "pydantic>=2.11.7",
    "polars>=1.29.0",
    "pyarrow>=20.0.0",

    # visualizations
    "matplotlib>=3.10.5",
    "seaborn>=0.13.2",
    "pyvis>=0.3.2",
    "yfiles-jupyter-graphs>=1.10.5",

    # notebook demos
    "jupyterlab>=4.4.8",
    "watermark>=2.5.0",

    # instrumentation, observability
    "icecream>=2.1.4",
]

classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Human Machine Interfaces",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Indexing",
]

keywords = [
    "anti fraud",
    "context engineering",
    "entity embedding",
    "entity linking",
    "entity resolution",
    "forensic accounting",
    "flow analysis",
    "graph algorithms",
    "graph visualization",
    "graphrag",
    "knowledge graph",
    "leaked data",
    "money laundering",
    "named entity recognition",
    "nlp",
    "ontology pipeline",
    "ontology",
    "open data",
    "relation extraction",
    "semantic expansion",
    "semantic layer",
    "semantic random walk",
    "synthetic data",
    "textgraphs",
    "thesaurus",
    "unstructured data",
    "vector database",
]

[project.urls]

homepage = "https://github.com/DerwenAI/cdl-2025-masterclass"
slides = "https://drive.proton.me/urls/S7352D48GG#eGkDq6kWhLFs"
conference = "https://2025.connected-data.london/talks/combining-data-from-structured-and-unstructured-sources-to-create-high-quality-knowledge-graphs/"

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
]

