[project]
name = "cdl-2025-masterclass"
version = "1.0.0"
description = "Example code to create high-quality knowledge graphs using entity resolution with Senzing and (XYZ)"

readme = "README.md"
license = { file = "LICENSE" }

authors = [
    { name = "Paco Nathan", email = "paco@derwen.ai" },
    { name = "Prashanth Rao", email = "prashanth@lancedb.com" },
]

requires-python = ">=3.13"
dependencies = [
    # graph technologies
    "ryugraph>=25.9.0",
    "kuzu==0.9.0",
    "networkx==3.4.2",
    "sz-semantics>=1.3.1",

    # Python "nuts and bolts"
    "numpy>=2.3.2",
    "pydantic>=2.11.7",
    "polars==1.29.0",
    "pyarrow==20.0.0",
    "python-dotenv==1.1.0",

    # visualizations
    "matplotlib>=3.10.5",
    "seaborn>=0.13.2",
    "pyvis>=0.3.2",
    "yfiles-jupyter-graphs==1.10.5",
    "yfiles-jupyter-graphs-for-kuzu==0.0.4",

    # notebook demos
    "jupyterlab==4.4.8",
    "watermark>=2.5.0",

    # instrumentation, observability
    "icecream==2.1.4",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
]

